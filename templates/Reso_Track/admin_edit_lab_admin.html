{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Lab Admin | RESOTRACK{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4 shadow-sm border-0 bg-white">
                <h3 class="fw-bold text-success mb-4 border-bottom pb-2">Edit Lab Administrator: {{ admin_user.first_name }}</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <small class="text-muted d-block mb-3">Leave password blank to keep current password.</small>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success px-4">Update Administrator</button>
                        <a href="{% url 'admin_labs' %}" class="btn btn-outline-secondary px-4 ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
