{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}RESOTRACK | Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold gradient-text"><i class="fas fa-sign-in-alt"></i> Login Tracker</h2>
                    <p class="text-muted">Enter your credentials to access your dashboard.</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-user text-primary"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter generic username" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-lock text-primary"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3 mt-4">
                        <button type="submit" class="btn gradient-btn btn-lg fw-bold shadow-sm">Login Now</button>
                    </div>
                </form>
                
                <div class="text-center">
                    <p class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-bold">Register Student Account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
