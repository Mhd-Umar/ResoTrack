{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}File a Complaint{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-custom p-4 shadow border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold gradient-text"><i class="fas fa-exclamation-triangle"></i> File Complaint</h2>
                    <p class="text-muted">Report faulty equipment or infrastructure to lab administrator</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">Submit Complaint</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
