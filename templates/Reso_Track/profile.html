{% extends 'base.html' %}

{% block title %}User Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom p-4 shadow-sm border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold gradient-text"><i class="fas fa-id-card"></i> Profile Overview</h2>
                    <p class="text-muted">Manage your personal information</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.first_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" class="form-control disabled" value="{{ user.username }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Department</label>
                        <input type="text" class="form-control disabled" value="{{ user.get_department_display }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <input type="text" class="form-control disabled" value="{{ user.get_role_display }}" readonly>
                    </div>

                    <h5 class="fw-bold mt-4 border-top pt-3">Change Password</h5>
                    <div class="mb-3">
                        <label class="form-label text-muted">New Password (leave blank to keep current)</label>
                        <input type="password" name="password" class="form-control">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary fw-bold shadow-sm">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
