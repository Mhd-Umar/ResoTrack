{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}RESOTRACK | Register{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-custom p-4 shadow border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold gradient-text"><i class="fas fa-user-plus"></i> Create Account</h2>
                    <p class="text-muted">Register to monitor and access lab resources</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn gradient-btn btn-lg fw-bold shadow-sm">Register</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-bold">Login Here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
